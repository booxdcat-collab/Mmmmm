[project]
name = "melody"
version = "3.0.3"
description = "Telegram Group Calls Streaming bot with some useful features."
readme = "README.md"
requires-python = ">=3.14"

dependencies = [
    "aiohttp~=3.14.5",
    "bgutil-ytdlp-pot-provider>=2.0.2",
    "kurigram~=2.2.27",
    "pillow>=13.0.0,<13.1",
    "psutil~=7.2.2",
    "py-tgcalls~=3.0.1",
    "py-yt-search>=0.8.2,<0.9.0",
    "pymongo>=4.20.0",
    "tgcrypto-c>=1.3.2",
    "python-dotenv~=1.2.4",
    "uvloop>=0.23.0; sys_platform != 'win32'",
    "yt-dlp[default]==2026.10.26",
]
